# URL de la base de datos local
spring.datasource.url=jdbc:mysql://localhost:3306/db_titta?createDatabaseIfNotExist=true&serverTimezone=UTC
# 'update' es más cómodo para desarrollo
spring.jpa.hibernate.ddl-auto=update
# Habilitamos todos los logs de SQL para depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
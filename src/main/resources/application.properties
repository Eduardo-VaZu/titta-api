spring.application.name=Titta API
server.port=8080
# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (MySQL)
# ===================================================================
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${BD_DRIVER:com.mysql.cj.jdbc.Driver}
# ===================================================================
# CONFIGURACIÓN DE JPA (Hibernate)
# ===================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# ===================================================================
# CONFIGURACIÓN DEL POOL DE CONEXIONES (HikariCP)
# (Valores optimizados que tenías antes. Son buenos para todos los entornos)
# ===================================================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=false
# ===================================================================
# CONFIGURACIÓN DE FLYWAY
# ===================================================================
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
# ===================================================================
# CONFIGURACIÓN DE SPRINGDOC (SWAGGER UI)
# (Tus configuraciones están perfectas)
# ===================================================================
springdoc.paths-to-match=/api/v1/**
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
info.app.name=API REST
info.app.description=Proyecto de ecommerce Titta
info.app.version=0.0.1
# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD Y JWT
# (Referencia a las variables de entorno)
# ===================================================================
security.jwt.key.secret=${JWT_KEY_SECRET}
security.jwt.user.generator=${JWT_USER_GENERATOR}
security.jwt.expiration.access-token=${JWT_EXPIRATION_TIME}
security.jwt.expiration.refresh-token=${JWT_REFRESH_EXPIRATION_TIME}
# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ===================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
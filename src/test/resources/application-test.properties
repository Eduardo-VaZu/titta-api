# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS PARA TESTS (H2)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Deshabilitamos Flyway para que Hibernate cree el esquema
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ===================================================================
# DUMMY PROPERTIES FOR TESTS
# ===================================================================
security.jwt.key.secret=dummy_secret_key_for_testing_1234567890
security.jwt.user.generator=titta
security.jwt.expiration.access-token=3600000
security.jwt.expiration.refresh-token=86400000

app.cors.allowed-origins=*
app.security.cookie.secure=false

stripe.api.key=sk_test_dummy
stripe.currency=usd

# Usar base de datos en memoria H2
spring.datasource.url=jdbc:h2:mem:titta_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crear tablas automáticamente al iniciar el test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Desactivar Flyway en tests para simplificar (o activarlo si quieres probar migraciones)
spring.flyway.enabled=false

# Claves JWT de prueba (para que no falle al iniciar)
security.jwt.key.secret=clave_secreta_super_segura_para_tests_12345
security.jwt.user.generator=TittaApiTest
security.jwt.expiration.access-token=3600000
security.jwt.expiration.refresh-token=86400000

# Propiedades adicionales para tests (mockeadas)
app.cors.allowed-origins=*
app.security.cookie.secure=false
stripe.api.key=sk_test_dummy
stripe.currency=usd

# Configuración de Redis para Pruebas
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
